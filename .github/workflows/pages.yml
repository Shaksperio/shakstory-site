name: Publicar site comercial no GitHub Pages
on:
  push:
    branches: [turbo]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: commercial-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Obter arquivos
        uses: actions/checkout@v4
      - name: Verificar banner com imagens PNG estaticas
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          html = Path("index.html").read_text(encoding="utf-8")
          for label in ("pena", "maquina", "celular"):
              name = f"assets/evolucao-{label}.png"
              data = Path(name).read_bytes()
              assert data.startswith(b"\x89PNG\r\n\x1a\n"), f"PNG invalido: {name}"
              assert f'src="{name}"' in html, f"HTML nao aponta para {name}"
          start = html.index('<section class="writing-evolution"')
          end = html.index('</section>', start)
          assert '.gif' not in html[start:end].lower(), "Banner ainda faz referencia a GIF"
          print("Banner estatico PNG validado")
          PY
      - name: Configurar Pages
        uses: actions/configure-pages@v5
      - name: Enviar artefato estatico
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
