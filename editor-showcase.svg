nt-size="20" fill="#506058"><text x="397" y="340">A cidade parecia adormecida quando a primeira</text><text x="397" y="374">luz atravessou a janela. Na mesa, uma carta</text><text x="397" y="408">ainda esperava por uma resposta.</text><text x="397" y="469">Ela rompeu o lacre. Desta vez, não havia volta.</text></g><path d="M398 505h246" stroke="#b0beb4" stroke-width="2"/><text x="904" y="588" text-anchor="end" fill="#98a69f" font-size="13" font-family="Arial">542 palavras</text></g><g filter="url(#sh)"><rect x="680" y="555" width="288" height="102" rx="16" fill="#0b6561"/><rect x="702" y="579" width="55" height="55" rx="14" fill="#d7f6e6"/><path d="m730 587 6 14 14 6-14 6-6 14-6-14-14-6 14-6z" fill="#188e7d"/><text x="773" y="594" font-size="20" font-weight="bold" fill="#fff" font-family="Arial">Cowila IA</text><text x="773" y="619" font-size="15" fill="#d3f2e9" font-family="Arial">Ideias, revisão e caminhos</text></g><text x="520" y="692" text-anchor="middle" fill="#3e746d" font-size="15" font-family="Arial">Ilustração conceitual do editor Shakstory</text></svg>