<svg xmlns="http://www.w3.org/2000/svg" width="900" height="670" viewBox="0 0 900 670"><defs><filter id="d"><feDropShadow dy="14" stdDeviation="20" flood-color="#092e30" flood-opacity=".2"/></filter></defs><rect width="900" height="670" rx="32" fill="#e4f5eb"/><path d="M0 500C180 380 280 620 480 520S750 400 900 540V670H0" fill="#c1e6d3"/><g filter="url(#d)"><rect x="100" y="49" width="700" height="572" rx="23" fill="#fff"/><path d="M123 49h654q23 0 23 23v75H100V72q0-23 23-23" fill="#0f4547"/><circle cx="151" cy="96" r="23" fill="#d1f4de"/><text x="151" y="105" text-anchor="middle" font-size="27" fill="#147c70">✦</text><text x="190" y="92" font-size="24" fill="white" font-weight="bold" font-family="Arial">Cowila</text><text x="190" y="118" font-size="16" fill="#b6ddd3" font-family="Arial">Coautora literária</text><rect x="136" y="168" width="628" height="68" rx="13" fill="#ecf5ee"/><text x="160" y="195" fill="#385e51" font-size="17" font-family="Arial">Como continuar a cena de modo convincente,</text><text x="160" y="217" fill="#385e51" font-size="17" font-family="Arial">sem repetir o que já aconteceu?</text><rect x="136" y="258" width="628" height="89" rx="13" fill="#fff" stroke="#cbded4"/><text x="160" y="286" font-size="14" fill="#398c7f" font-family="Arial" font-weight="bold">CAMINHO 1 · FIEL À CENA</text><text x="160" y="315" font-size="18" fill="#314c44" font-family="Georgia">Uma pista altera o que a protagonista acredita.</text><rect x="136" y="361" width="628" height="89" rx="13" fill="#e5f7eb" stroke="#79c4a7" stroke-width="2"/><text x="160" y="389" font-size="14" fill="#267e6e" font-family="Arial" font-weight="bold">CAMINHO 2 · MAIS TENSÃO</text><text x="160" y="418" font-size="18" fill="#314c44" font-family="Georgia">Uma interrupção exige uma escolha imediata.</text><rect x="136" y="465" width="628" height="89" rx="13" fill="#fff" stroke="#cbded4"/><text x="160" y="493" font-size="14" fill="#398c7f" font-family="Arial" font-weight="bold">CAMINHO 3 · MAIS SUBTEXTO</text><text x="160" y="522" font-size="18" fill="#314c44" font-family="Georgia">Um gesto transforma a relação dos personagens.</text><text x="450" y="595" font-size="16" fill="#3a6e62" text-anchor="middle" font-family="Arial">O autor decide o que aproveitar.</text></g><text x="450" y="648" font-size="14" fill="#467b6b" text-anchor="middle" font-family="Arial">Exemplo de interface ilustrativa — não é saída real da IA</text></svg>